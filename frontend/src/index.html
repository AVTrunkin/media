<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Timeline</title>
</head>
<body>
  <div class="timeline"></div>
  <form class="add-post">
    <input class="add-post__input" placeholder="Что нового?" />
    <button type="button" class="mic-btn"></button>
    <button type="button" class="video-btn"></button>
    <div class="record-controls">
      <button type="button" class="record-ok">✔</button>
      <span class="record-timer">0 с</span>
      <button type="button" class="record-cancel">✖</button>
    </div>
  </form>

  <div class="modal">
    <div class="modal__body">
      <h3>Что-то пошло не так</h3>
      <p>К сожалению, нам не удалось определить ваше местоположение, пожалуйста,
        дайте разрешение на использование геолокации, либо введите координаты вручную.</p>
      <p>Широта и долгота через запятую</p>
      <input class="modal__input" value="51.50851, -0.12572" />
      <div class="modal__error"></div>
      <div class="modal__actions">
        <button type="button" class="modal__cancel">Отмена</button>
        <button type="button" class="modal__ok">ОК</button>
      </div>
    </div>
  </div>
  
  <div class="record-controls">
    <span class="record-timer">0 с</span>
    <button type="button" class="record-ok">ОК</button>
    <button type="button" class="record-cancel">Отмена</button>
  </div>
</body>
</html>
